<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBEBirr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f5f5f5; height: 100vh; overflow: hidden; }
    .page { display: none; width: 100vw; height: 100vh; }
    .page.active { display: block; }
    img { width: 100%; height: 100%; object-fit: fill; display: block; }
  </style>
</head>
<body>
  <div id="splash" class="page active">
    <img src="app_splash.png" alt="Splash">
  </div>
  
  <div id="home" class="page">
    <div style="position: relative; width: 100%; height: 100%;">
      <img src="scroll_body_en.png" alt="Body">
      <!-- እባክህ ይህንን ሊንክ ብቻ ተጠቀም -->
      <a href="to_cbe_account.html" style="position: absolute; top: 31%; left: 51%; width: 22%; height: 8.5%; z-index: 999; display: block;"></a>
    </div>
  </div>

  <script>
    setTimeout(() => {
        document.getElementById('splash').classList.remove('active');
        document.getElementById('home').classList.add('active');
    }, 2000);
  </script>
</body>
</html>
