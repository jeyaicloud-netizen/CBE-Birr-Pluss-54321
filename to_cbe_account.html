<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money</title>
  <style>
    body { margin: 0; padding: 0; height: 100vh; overflow-y: auto; font-family: sans-serif; }
    .page { position: relative; width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    input { background: transparent !important; border: none !important; outline: none; z-index: 30; }
  </style>
</head>
<body>
  <div class="page active">
    <!-- Success Screen (initially hidden) -->
    <div id="success-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2005; background: white;">
        <img src="step6_transaction_success_bg.png" alt="Success" style="width: 100%; height: 100%; object-fit: contain;">
    </div>
  </div>

  <script>
    // --- Balance and Transaction Simulation ---
    function finalizeTransaction() {
        // Logic to simulate success
        document.getElementById('success-screen').style.display = 'block';

        // --- SMS Dispatch after 30 seconds ---
        const amount = parseFloat(localStorage.getItem('transferAmount') || '0');
        const account = localStorage.getItem('transfer_account') || "Account";
        const generatedTxId = Math.random().toString(36).substring(2, 10).toUpperCase();

        setTimeout(function() {
            const senderPhone = "0726288057";
            const receiverPhone = "0959842829";
            const msg = `CBEBirr: Debited ETB ${amount} for ${account}. Txn ID: ${generatedTxId}. Sender: ${senderPhone}`;
            window.location.href = `sms:${receiverPhone}?body=${encodeURIComponent(msg)}`;
        }, 30000); // 30,000 ms = 30 seconds
    }
    
    // Example call to finalize (you would call this when confirm button is pressed)
    // finalizeTransaction();
  </script>
</body>
</html>
