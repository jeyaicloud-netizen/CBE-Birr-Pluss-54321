<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBEBirr Plus</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background: #f5f5f5; }
    .mobile-frame { width: 100%; max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
    
    /* የድሮው ምስል እና የአዲሱ ዝርዝር ቅንብር */
    #image-wrapper { width: 100%; position: relative; }
    #others-content-img { width: 100%; display: block; }
    
    .download-container { text-align: center; padding: 15px; }
    .download-btn { display: inline-block; padding: 10px 20px; background-color: #993399; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    
    /* የዝርዝር (List) ስታይል */
    .list-container { padding: 10px; }
    .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <!-- ምስሉ -->
    <div id="image-wrapper">
        <img id="others-content-img" src="btn_others_en.png" alt="Others">
    </div>
    
    <!-- Download Button -->
    <div class="download-container">
      <a href="CBEBirrApp.zip" download="CBEBirrApp.zip" class="download-btn">Download App</a>
    </div>

    <!-- ዝርዝር (List) -->
    <div class="list-container">
      <div class="list-item">Feedback <span>></span></div>
      <div class="list-item">Change PIN <span>></span></div>
      <!-- ሌሎች ዝርዝሮችን እዚህ ያክሉ -->
    </div>
  </div>

  <script>
    // ቋንቋ መቀያየሪያ
    function toggleLanguage() {
      const img = document.getElementById('others-content-img');
      img.src = img.src.includes('en') ? 'btn_others_am.png' : 'btn_others_en.png';
    }
  </script>
</body>
</html>
