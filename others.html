<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Others / ሌሎች</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; font-family: sans-serif; }
    #others-header { background: #6b1d7f; color: white; padding: 20px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
    .lang-btn { cursor: pointer; background: transparent; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 5px; }
    #others-content-img { width: 100%; display: block; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; background: white; padding: 20px; border-radius: 10px; z-index: 1000; }
    .modal.active { display: block; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    .modal-overlay.active { display: block; }
  </style>
</head>
<body>
  <div id="others-header">
    <div onclick="window.history.back()">←</div>
    <span>Others / ሌሎች</span>
    <button class="lang-btn" onclick="toggleLanguage()">EN/AM</button>
  </div>
  
  <div>
    <!-- ምስሎቹ በቀጥታ በስማቸው ተጠሩ -->
    <img id="others-content-img" src="btn_others_en.png" alt="Others">
    <a href="CBEBirrApp.zip" download="CBEBirrApp.zip" style="display:block; text-align:center; padding:10px; background:#993399; color:white;">Download App</a>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModals()"></div>
  <div class="modal" id="save-modal">
    <h3>Save Account</h3>
    <input type="text" id="acc-name" placeholder="Name">
    <input type="text" id="acc-number" placeholder="Number">
    <button onclick="saveAccount()">Save</button>
  </div>

  <script>
    let currentLang = localStorage.getItem('lang') || 'EN';
    
    function toggleLanguage() {
      currentLang = currentLang === 'AM' ? 'EN' : 'AM';
      localStorage.setItem('lang', currentLang);
      // ምስሎቹን በስማቸው ብቻ ጠራናቸው
      document.getElementById('others-content-img').src = currentLang === 'AM' ? 'btn_others_am.png' : 'btn_others_en.png';
    }

    function saveAccount() {
        const name = document.getElementById('acc-name').value;
        const number = document.getElementById('acc-number').value;
        const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
        accounts.push({ name, number });
        localStorage.setItem('savedAccounts', JSON.stringify(accounts));
        closeModals();
    }
    
    function closeModals() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }
    
    // ምስሉን ሲጭን የመጀመሪያውን ቋንቋ ይይዛል
    document.getElementById('others-content-img').src = currentLang === 'AM' ? 'btn_others_am.png' : 'btn_others_en.png';
  </script>
</body>
</html>
