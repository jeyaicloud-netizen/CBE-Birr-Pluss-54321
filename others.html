<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <title>CBEBirr Plus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    .page { display: none; }
    .page.active { display: flex; flex-direction: column; height: 100vh; }
  </style>
</head>
<body>
  <div id="signin-page" class="page active">
    <img id="signin-image" src="/cbe_signin_english.png" alt="Sign-In" style="width: 100%;">
    <button onclick="toggleSigninLanguage()">Toggle AM/EN</button>
  </div>

  <script>
    let signinLanguage = 'EN';
    function toggleSigninLanguage() {
      signinLanguage = signinLanguage === 'AM' ? 'EN' : 'AM';
      document.getElementById('signin-image').src = signinLanguage === 'AM' ? '/cbe_signin_amharic.png' : '/cbe_signin_english.png';
    }
  </script>
</body>
</html>
