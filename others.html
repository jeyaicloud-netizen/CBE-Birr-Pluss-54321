<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Others / ሌሎች</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        
        #others-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 16px; 
            background: #fff; 
            border-bottom: 1px solid #ddd;
        }
        .lang-btn { 
            cursor: pointer; 
            padding: 6px 12px; 
            background: #800080; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold;
        }

        #others-body { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        #image-wrapper { position: relative; width: 100%; }
        #others-content-img { width: 100%; height: auto; display: block; user-select: none; }

        /* Overlay buttons */
        .click-overlay { position: absolute; cursor: pointer; }
        
        /* Modals (የሚከፈቱ ሳጥኖች) */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 100; 
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 85%; max-width: 400px; 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            z-index: 101; 
        }
        .modal.active, .modal-overlay.active { display: block; }

        .form-group { margin-bottom: 12px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #28a745; color: white; }
        .btn-cancel { background: #dc3545; color: white; }
        .btn-view { background: #007bff; color: white; width: 100%; margin-top: 8px; }

        .acc-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <div id="others-header">
        <span onclick="goBack()" style="cursor:pointer; font-size: 18px;">⬅ Back</span>
        <strong>Others / ሌሎች</strong>
        <button class="lang-btn" onclick="toggleLanguage()">AM / EN</button>
    </div>

    <!-- Main Content Image -->
    <div id="others-body">
        <div id="image-wrapper">
            <img id="others-content-img" src="btn_others_am.png" alt="Others Content">
            
            <!-- Home Click Overlay (ከታች ወደ Home ለመመለስ) -->
            <div class="click-overlay" style="bottom: 0; left: 0; width: 100%; height: 70px;" onclick="goHome()"></div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModals()"></div>

    <!-- 1. Add/Save Account Modal (Long Press ሲደረግ የሚከፈተው) -->
    <div id="add-modal" class="modal">
        <h3>Save Account / አካውንት መዝግብ</h3>
        <div class="form-group">
            <input type="text" id="acc-name" placeholder="Account Name (ስም)">
        </div>
        <div class="form-group">
            <input type="text" id="acc-number" placeholder="Account Number (አካውንት ቁጥር)">
        </div>
        <div class="btn-group">
            <button class="btn btn-save" onclick="saveAccount()">Save</button>
            <button class="btn btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
        <button class="btn btn-view" onclick="showModal('list-modal')">Saved Accounts (የተመዘገቡ አካውንቶች)</button>
    </div>

    <!-- 2. Saved Accounts List Modal -->
    <div id="list-modal" class="modal">
        <h3>Saved Accounts</h3>
        <div id="saved-accounts-list" style="max-height: 200px; overflow-y: auto;">
            <!-- Accounts will be loaded here dynamically -->
        </div>
        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeModals()">Close</button>
        </div>
    </div>

    <!-- 3. Edit Account Modal -->
    <div id="edit-modal" class="modal">
        <h3>Edit Account</h3>
        <input type="hidden" id="edit-acc-index">
        <div class="form-group">
            <input type="text" id="edit-acc-name">
        </div>
        <div class="form-group">
            <input type="text" id="edit-acc-number">
        </div>
        <div class="btn-group">
            <button class="btn btn-save" onclick="updateAccount()">Update</button>
            <button class="btn btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- JavaScript Control Logic -->
    <script>
        // ገጹ ሲከፈት ቋንቋውን እና Long Pressን ማዘጋጀት
        window.addEventListener('DOMContentLoaded', () => {
            updateImages();
            setupLongPress();
        });

        // 1. የቋንቋ መቀየሪያ Logic
        function updateImages() {
            const imgElement = document.getElementById('others-content-img');
            let currentLang = localStorage.getItem('lang') || 'AM';
            if (imgElement) {
                imgElement.src = (currentLang === 'AM') ? 'btn_others_am.png' : 'btn_others_en.png';
            }
        }
        
        function toggleLanguage() {
            let currentLang = localStorage.getItem('lang') || 'AM';
            currentLang = (currentLang === 'AM') ? 'EN' : 'AM';
            localStorage.setItem('lang', currentLang);
            updateImages();
        }

        // 2. Navigation Functions
        function goHome() {
            localStorage.setItem('showHome', 'true');
            window.location.href = 'index.html';
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // 3. Modals Management
        function showModal(id) {
            closeModals(); // ሌሎችን መጀመሪያ መዝጋት
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById(id).classList.add('active');
            if (id === 'list-modal') renderAccounts();
        }

        function closeModals() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        // 4. Save/Edit/Delete Accounts Logic
        function saveAccount() {
            const name = document.getElementById('acc-name').value.trim();
            const number = document.getElementById('acc-number').value.trim();
            if (!name || !number) {
                alert('እባክዎን ስምና አካውንት ቁጥር ያስገቡ');
                return;
            }
            
            const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            accounts.push({ name, number });
            localStorage.setItem('savedAccounts', JSON.stringify(accounts));
            
            document.getElementById('acc-name').value = '';
            document.getElementById('acc-number').value = '';
            alert('አካውንቱ በትክክል ተቀምጧል!');
            closeModals();
        }

        function renderAccounts() {
            const container = document.getElementById('saved-accounts-list');
            const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            
            if (accounts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">ምንም የተቀመጠ አካውንት የለም</p>';
                return;
            }

            container.innerHTML = accounts.map((acc, index) => `
                <div class="acc-item">
                    <div><strong>${acc.name}</strong><br><small>${acc.number}</small></div>
                    <div class="acc-actions">
                        <button class="action-btn" onclick="editAccount(${index})">✏️</button>
                        <button class="action-btn" onclick="deleteAccount(${index})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function editAccount(index) {
            const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            const acc = accounts[index];
            document.getElementById('edit-acc-name').value = acc.name;
            document.getElementById('edit-acc-number').value = acc.number;
            document.getElementById('edit-acc-index').value = index;
            showModal('edit-modal');
        }

        function updateAccount() {
            const index = document.getElementById('edit-acc-index').value;
            const name = document.getElementById('edit-acc-name').value.trim();
            const number = document.getElementById('edit-acc-number').value.trim();
            if (!name || !number) return;
            
            const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            accounts[index] = { name, number };
            localStorage.setItem('savedAccounts', JSON.stringify(accounts));
            
            renderAccounts();
            showModal('list-modal');
        }

        function deleteAccount(index) {
            const accounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            accounts.splice(index, 1);
            localStorage.setItem('savedAccounts', JSON.stringify(accounts));
            renderAccounts();
        }

        // 5. Long Press Handling (በስክሪኑ/ምስሉ ላይ ተጭኖ ሲያዙ)
        function setupLongPress() {
            const targetElement = document.getElementById('others-content-img');
            if (!targetElement) return;

            let timer = null;

            const startHold = () => {
                timer = setTimeout(() => {
                    showModal('add-modal'); // Long press ሲደረግ ማከያ ሳጥኑ ይከፈታል
                }, 600); // 0.6 ሰከንድ ተጭኖ ሲያዝ
            };

            const cancelHold = () => {
                if (timer) clearTimeout(timer);
            };

            // Touch events for mobile
            targetElement.addEventListener('touchstart', startHold);
            targetElement.addEventListener('touchend', cancelHold);
            targetElement.addEventListener('touchmove', cancelHold);
            
            // Mouse events for desktop/testing
            targetElement.addEventListener('mousedown', startHold);
            targetElement.addEventListener('mouseup', cancelHold);
            targetElement.addEventListener('mouseleave', cancelHold);
        }
    </script>
</body>
</html>
